<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .layer-box { fill: none; stroke: #333; stroke-width: 2; rx: 8; ry: 8; }
    .layer-title { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; text-anchor: middle; }
    .layer-desc { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; fill: #666; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); marker-start: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- 军事应用层 -->
  <rect x="100" y="50" width="600" height="80" class="layer-box" />
  <text x="400" y="80" class="layer-title">军事应用层</text>
  <text x="400" y="105" class="layer-desc">面向作战任务的智能保障</text>

  <!-- 应用层 ↔ 智能层 -->
  <line x1="400" y1="130" x2="400" y2="170" class="arrow" />

  <!-- AI Agent智能层 -->
  <rect x="100" y="170" width="600" height="80" class="layer-box" />
  <text x="400" y="200" class="layer-title">AI Agent智能层</text>
  <text x="400" y="225" class="layer-desc">大模型推理与工具链调用</text>

  <!-- 智能层 ↔ 服务层 -->
  <line x1="400" y1="250" x2="400" y2="290" class="arrow" />

  <!-- MCP服务层 -->
  <rect x="100" y="290" width="600" height="80" class="layer-box" />
  <text x="400" y="320" class="layer-title">MCP服务层</text>
  <text x="400" y="345" class="layer-desc">标准化工具接口封装</text>

  <!-- 服务层 ↔ 数据层 -->
  <line x1="400" y1="370" x2="400" y2="410" class="arrow" />

  <!-- 数据资源层 -->
  <rect x="100" y="410" width="600" height="80" class="layer-box" />
  <text x="400" y="440" class="layer-title">数据资源层</text>
  <text x="400" y="465" class="layer-desc">多源测绘数据治理与索引</text>

  <!-- 右侧架构特性标注 -->
  <text x="720" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle" transform="rotate(90, 720, 300)">标准化接口 · 松耦合 · 安全隔离</text>
</svg>