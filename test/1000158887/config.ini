; 地磁日变重构系统配置文件
; 坐标从IAGA文件头自动提取，配置文件中提供的手动坐标优先级最高
; 纬差贡献是经度差的10倍

[General]
TargetMode = Full
OutputFormat = DHZ
DataDir = data

[InputStations]
; 格式: 名称, 坐标系(DHZ/XYZ), [纬度], [经度], [高程]
; 后三者可选，提供则覆盖文件头坐标
Station0 = TaiAn, DHZ
Station1 = YuLin, DHZ
Station2 = MengCheng, DHZ
Station3 = Memambetsu, XYZ

[TargetStation]
Name = Hongshan
; 目标台站坐标（FOnly模式下必须提供，Full模式下可从IAGA文件提取）
; Lat = 36.50
; Lon = 114.50
; Elev = 0
ModelX = models/xgb_x.model
ModelY = models/xgb_y.model
ModelZ = models/xgb_z.model
ModelF = models/xgb_f.model
